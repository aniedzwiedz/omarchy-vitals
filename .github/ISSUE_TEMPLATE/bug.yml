name: Bug report
description: Something looks wrong on the bar or in the panel
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: CPU stuck at —, GPU missing, settings not saving, …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: `jq -r .version ~/.config/omarchy/plugins/hamsti.vitals/manifest.json`
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      description: `omarchy version`
  - type: textarea
    id: hardware
    attributes:
      label: CPU / GPU
      placeholder: Intel Ultra 9 285K, RTX 5090, AMD, …
